name: Rename api bundle
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git mv api/api-index.js api/index.js
          git config user.name "craftmaker76-prog"
          git config user.email "craftmaker76-prog@users.noreply.github.com"
          git commit -m "Rename api-index.js to index.js"
          git push
